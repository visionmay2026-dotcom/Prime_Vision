<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f2a4a"><link rel="manifest" href="/admin.webmanifest"><link rel="icon" href="/icons/admin-192.png"><link rel="apple-touch-icon" href="/icons/admin-192.png"><link rel="stylesheet" href="fonts.css"><title>Prime Vision</title><script>fetch("/api/public-settings").then(function(r){return r.json()}).then(function(s){if(s&&s.logo==="1"){var u="/api/logo?v="+Math.floor(Date.now()/3600000);["icon","apple-touch-icon"].forEach(function(r){var l=document.createElement("link");l.rel=r;l.href=u;document.head.appendChild(l)})}}).catch(function(){});</script><meta name="application-name" content="Prime Vision"><meta name="apple-mobile-web-app-title" content="Prime Vision">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;background:#f5f1ea;color:#10294a}header{background:#10294a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e4dccd}nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfc5b2;border-radius:8px;background:#fff}button{cursor:pointer;background:#10294a;color:#fff;border:0}button.l{background:#fff;color:#10294a;border:1px solid #cfc5b2}button.on{background:#c9983a;color:#10294a}button.d{background:#a33}
main{padding:12px;max-width:1000px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{background:#fff;border-radius:12px;padding:14px;text-align:center}.c b{display:block;font-size:26px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:14px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0;background:#fff;padding:10px;border-radius:12px}.sc{overflow:auto}.th{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee}.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:120px}.low{background:#fff4d6}.tag{font-size:12px;background:#eee;border-radius:6px;padding:2px 6px}.ed{width:100%;min-width:90px}.ok{color:#2a7a3a}#login{max-width:320px;margin:60px auto;background:#fff;padding:20px;border-radius:14px;display:grid;gap:10px}.rl{display:flex;flex-direction:column;font-size:11px;gap:2px}

</style><style>.noadd,.nc3 th:nth-child(3),.nc3 td:nth-child(3),.nc4 th:nth-child(4),.nc4 td:nth-child(4){display:none}</style></head><body>
<div id="login"><h3>لوحة التحكم</h3><input id="pw" type="password" placeholder="كلمة المرور"><button id="lb">دخول</button><small id="le" style="color:#a33"></small></div>
<div id="app" hidden><header><b>Prime Vision · لوحة التحكم</b><button class="l" id="out">خروج</button></header><nav id="nav"></nav><main id="m"></main></div>
<script>
const T={dash:'الرئيسية',products:'المنتجات والمخزون',requests:'الطلبات الواردة',orders:'الطلبات',customers:'العملاء',a_sale:'المبيعات',a_purchase:'المشتريات',a_expense:'المصروفات',a_debts:'الذمم',a_ledger:'دفتر النقد',a_report:'التقارير المالية',a_banks:'البنوك',a_custody:'عهدة المصروفات',a_all:'الصندوق والبنوك',a_report2:'التقرير الموحد',a_fs:'القوائم المالية',a_msg:'رسائل العملاء',a_export:'تصدير وتحليل',a_sup:'الموردون',a_coa:'دليل الحسابات',a_docs:'المستندات',a_rx:'الوصفات الطبية',a_lens:'طلبات العدسات',a_lgrid:'نطاق العدسات',a_bulk:'طلبيات الجملة',a_inv:'Stock',a_stmt:'كشف الحساب',a_adj:'المردودات والإشعارات'};
const ST=['جديد','مؤكد','قيد المعالجة','تم التواصل','مكتمل','ملغي'];const CATS=['الفريمات','العدسات الطبية','العدسات اللاصقة التجميلية','العدسات اللاصقة الطبية','أدوات بصريات','أخرى'];let CF='';const catSel=(v,attrs)=>`<select ${attrs}>${v&&!CATS.includes(v)?`<option value="${esc(v)}" selected>${esc(v)} (قديم)</option>`:''}${v?'':'<option value="">الفئة</option>'}${CATS.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select>`;
let tab='dash',Q='',SF='';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=()=>sessionStorage.pvt||'';
const money=n=>Number(n||0).toLocaleString('en-US')+' ج.س';
const dt=s=>s?String(s).slice(0,16).replace('T',' '):'';
const has=(o,q)=>!q||Object.values(o).some(v=>String(v==null?'':v).toLowerCase().includes(q.toLowerCase()));
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+tok()},body:o.body&&JSON.stringify(o.body)});if(r.status===401&&p!=='login'){sessionStorage.pvt='';location.reload();return[]}return r.json()}
const toast=m=>{let t=$('#ts');if(!t){t=document.createElement('div');t.id='ts';t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#10294a;color:#fff;padding:8px 16px;border-radius:10px;z-index:9';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',1800)};
$('#lb').onclick=async()=>{const r=await api('login',{method:'POST',body:{password:$('#pw').value}});if(r.token){sessionStorage.pvt=r.token;start()}else $('#le').textContent='كلمة المرور غير صحيحة'};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lb').click()};$('#out').onclick=()=>{sessionStorage.pvt='';location.reload()};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(rows){if(!rows.length)return'';const k=Object.keys(rows[0]).filter(x=>x!=='image');return '\ufeff'+[k.join(',')].concat(rows.map(r=>k.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))).join('\n')}
const MGR=[['الرئيسية',['dash']],['المبيعات والعملاء',['a_sale','customers','a_quote','a_stmt','a_adj']],['طلبات المتجر والرسائل',['requests','orders','a_bulk','a_msg']],['المشتريات والموردون',['a_purchase','a_sup','a_expense']],['المخزون',['products','a_inv','a_lgrid']],['النظارات والعدسات',['a_rx','a_lens']],['الصندوق والبنوك',['a_ledger','a_banks','a_custody','a_all','a_close','a_open','a_debts']],['التقارير',['a_report','a_report2','a_fs','a_export']],['الإعدادات والمستندات',['a_shop','a_docs','a_files','a_coa','a_log']]];
const getPin=()=>{try{const x=JSON.parse(localStorage.pvPin||'null');return Array.isArray(x)?x:null}catch(e){return null}};
const setPin=a=>{try{localStorage.pvPin=JSON.stringify(a)}catch(e){}};
function openMenu(){const ks=Object.keys(T);let pin=getPin()||['dash'];const used=new Set();const gs=MGR.map(([t,l])=>[t,l.filter(k=>T[k])]);gs.forEach(g=>g[1].forEach(k=>used.add(k)));const rest=ks.filter(k=>!used.has(k));if(rest.length)gs.push(['أخرى',rest]);
 const o=document.createElement('div');o.id='mnov';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60';const d=document.createElement('div');d.style.cssText='position:absolute;top:0;bottom:0;right:0;width:min(330px,92vw);background:#fff;overflow:auto;padding:12px;box-shadow:-2px 0 12px rgba(0,0,0,.25)';o.appendChild(d);
 const draw=()=>{d.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><b>القائمة</b><button class="l" id="mnx">إغلاق</button></div><p style="font-size:12px;color:#555;margin:6px 0">الدبوس يثبّت العنصر في الشريط العلوي. اختيارك يُحفظ في هذا المتصفح.</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="l" id="pa">تثبيت الكل</button><button class="l" id="pn">إلغاء تثبيت الكل</button></div>'+gs.map(([t,l],i)=>`<details ${l.includes(tab)||i===0?'open':''} style="border-top:1px solid #ddd;padding:4px 0"><summary style="cursor:pointer;font-weight:700;padding:6px 0">${t}</summary>${l.map(k=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 6px"><button class="${k===tab?'on':'l'}" data-go="${k}" style="flex:1;text-align:right">${T[k]}</button><label title="تثبيت في الشريط العلوي" style="cursor:pointer"><input type="checkbox" data-pin="${k}" ${pin.includes(k)?"checked":""}> تثبيت</label></div>`).join('')}</details>`).join('');
  d.querySelector('#mnx').onclick=()=>o.remove();d.querySelector('#pa').onclick=()=>{pin=ks.slice();setPin(pin);draw();start(true)};d.querySelector('#pn').onclick=()=>{pin=[];setPin(pin);draw();start(true)};
  d.querySelectorAll('[data-pin]').forEach(c=>c.onchange=()=>{pin=c.checked?pin.concat([c.dataset.pin]):pin.filter(x=>x!==c.dataset.pin);setPin(pin);start(true)});
  d.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;Q='';SF='';CF='';o.remove();start()})};
 o.onclick=e=>{if(e.target===o)o.remove()};draw();document.body.appendChild(o)}
function start(keepMenu){$('#login').hidden=true;$('#app').hidden=false;const PN=getPin()||['dash'];$('#nav').innerHTML='<button class="l" id="mn">☰ القائمة</button>'+Object.entries(T).filter(([k])=>PN.includes(k)||k===tab).map(([k,v])=>`<button class="${k===tab?'on':'l'}" data-k="${k}">${v}</button>`).join('')+'<button class="l" id="ex">نسخة احتياطية JSON</button><button class="l" id="ec">تصدير CSV</button><button class="l" id="fx">نسخة كاملة (كل الجداول والمستندات)</button>';
document.querySelectorAll('#nav [data-k]').forEach(b=>b.onclick=()=>{tab=b.dataset.k;Q='';SF='';CF='';start()});$('#mn').onclick=openMenu;
$('#ex').onclick=async()=>{dl('pv-backup.json',JSON.stringify(await api('admin/export'),null,1),'application/json')};
$('#ec').onclick=async()=>{const d=await api('admin/export');for(const k of['products','customers','orders','requests'])dl('pv-'+k+'.csv',csv(d[k]),'text/csv')};render()}
const bar=(ph,withSt)=>`<div class="bar"><input id="q" placeholder="${ph}" value="${esc(Q)}">${withSt?`<select id="sf"><option value="">كل الحالات</option>${ST.map(s=>`<option ${s===SF?'selected':''}>${s}</option>`).join('')}</select>`:''}</div>`;
function hookBar(){const q=$('#q');q.oninput=()=>{Q=q.value;clearTimeout(hookBar.h);hookBar.h=setTimeout(()=>render(true),250)};const s=$('#sf');if(s)s.onchange=()=>{SF=s.value;render(true)}}
const stSel=(id,cur)=>`<select data-id="${id}">${ST.map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('')}</select>`;
function put(path,body,msg){return api(path,{method:'PUT',body}).then(()=>toast(msg||'تم الحفظ'))}
async function render(keep){const m=$('#m');m.dir='';
if(tab==='a_files')return renderFiles(m);if(tab==='a_close')return renderClose(m);if(tab.startsWith('a_'))return renderAcc(m);
if(tab==='dash'){const [s,P,R]=await Promise.all([api('admin/stats'),api('admin/products'),api('admin/requests')]);const low=P.filter(p=>p.active&&p.stock<=3);
m.innerHTML='<div class="cards">'+[['المنتجات',s.products],['مخزون منخفض',s.lowStock],['طلبات واردة جديدة',s.newRequests],['طلبات مفتوحة',s.openOrders],['العملاء',s.customers],['المبيعات المكتملة',money(s.sales)]].map(x=>`<div class="c">${x[0]}<b>${esc(x[1])}</b></div>`).join('')+'</div><h4>مخزون منخفض (3 أو أقل)</h4>'+(low.length?'<table>'+low.map(p=>`<tr class="low"><td>${esc(p.name)}</td><td>${p.stock}</td></tr>`).join('')+'</table>':'<p>لا يوجد.</p>')+'<h4>آخر الطلبات الواردة</h4>'+(R.length?'<table>'+R.slice(0,5).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.product)}</td><td>${esc(r.status)}</td><td>${dt(r.created)}</td></tr>`).join('')+'</table>':'<p>لا يوجد.</p>')+'<h4>إعدادات المتجر</h4><div class="f"><label><input type="checkbox" id="sw"> إظهار طلبية الجملة في المتجر</label><label><input type="checkbox" id="sf2"> إظهار الفريمات في المتجر</label><label><input type="checkbox" id="sbk"> تفعيل حجز موعد كشف نظر في المتجر</label></div><div class="f" id="bkbox"><label>أوقات الحجز المتاحة (HH:MM، مفصولة بفاصلة، مثال 10:00,10:30)<input id="bkslots" dir="ltr" placeholder="مثال: 10:00,10:30,11:00"></label><button class="l" id="bkSave">حفظ الأوقات</button></div><p><small>الحجز افتراضيا مُوقف، وقائمة الأوقات فارغة: أضف أوقات الدوام التي تناسبك (لا يظهر النموذج بدون أوقات). عند التفعيل يظهر نموذج الحجز في المتجر، والحجوزات تصل إلى تبويب الطلبات بنوع «حجز كشف نظر» وتأكدها بنفسك. لا دفع ولا قيود محاسبية.</small></p><p><small>الافتراضي: ظاهر. الإيقاف يخفي القسم عن الزبائن فقط ولا يحذف أي بيانات. يشمل إخفاء الفريمات: منتجات فئة الفريمات في المتجر وقسمي النظارات الطبية والشمسية في الصفحة الرئيسية.</small></p>';try{const ss=await api('admin/site-settings');$('#sw').checked=ss.wholesale!=='0';$('#sf2').checked=ss.frames!=='0';$('#sbk').checked=ss.booking==='1';$('#bkslots').value=ss.slots||''}catch(e){}
$('#sw').onchange=async e=>{await api('admin/site-settings',{method:'POST',body:{k:'show_wholesale',v:e.target.checked?'1':'0'}});toast('تم الحفظ')};$('#sbk').onchange=async e=>{await api('admin/site-settings',{method:'POST',body:{k:'show_booking',v:e.target.checked?'1':'0'}});toast(e.target.checked?($('#bkslots').value.trim()?'تم تفعيل الحجز في المتجر':'تم التفعيل، لكن النموذج لن يظهر حتى تضيف أوقاتا'):'تم إيقاف الحجز')};$('#bkSave').onclick=async()=>{try{await api('admin/site-settings',{method:'POST',body:{k:'booking_slots',v:$('#bkslots').value}});toast('تم حفظ الأوقات')}catch(e){toast('صيغة الأوقات غير صحيحة')}};$('#sf2').onchange=async e=>{await api('admin/site-settings',{method:'POST',body:{k:'show_frames',v:e.target.checked?'1':'0'}});toast('تم الحفظ')};return}
if(tab==='products'){const L=await api('admin/products');
const rows=L.filter(p=>has(p,Q)&&(!CF||(CATS.includes(p.category)?p.category:'أخرى')===CF)).map(p=>`<tr class="${p.stock<=3?'low':''}"><td>${p.image?`<img class="th" src="${esc(p.image)}">`:''}<br><label class="tag" style="cursor:pointer">صورة<input type="file" accept="image/*" data-img="${p.id}" hidden></label></td><td><input class="ed" value="${esc(p.name)}" data-id="${p.id}" data-f="name"><input class="ed" value="${esc(p.brand)}" data-id="${p.id}" data-f="brand" placeholder="العلامة"><input class="ed" value="${esc(p.description)}" data-id="${p.id}" data-f="description" placeholder="وصف"></td><td>${catSel(p.category||'',`class="ed" data-id="${p.id}" data-f="category"`)}</td><td><input style="width:80px" type="number" min="0" value="${p.price||0}" data-id="${p.id}" data-f="price"></td><td><input style="width:64px" type="number" min="0" value="${p.stock}" data-id="${p.id}" data-f="stock"></td><td><input style="width:80px" type="number" min="0" value="${p.cost||''}" placeholder="غير محددة" data-id="${p.id}" data-f="cost"></td><td><input class="ed" dir="ltr" style="width:90px" value="${esc(p.sku)}" data-id="${p.id}" data-f="sku" placeholder="SKU"><input class="ed" dir="ltr" style="width:110px" value="${esc(p.barcode)}" data-id="${p.id}" data-f="barcode" placeholder="باركود"></td><td>${p.cost>0&&p.price>0?Math.round((p.price-p.cost)/p.price*100)+'%':'-'}</td><td><input type="checkbox" ${p.active?'checked':''} data-id="${p.id}" data-f="active"></td><td><button class="d" data-del="${p.id}">حذف</button></td></tr>`).join('');
m.innerHTML=`<div class="f" id="pf"><input name="name" placeholder="اسم المنتج">${catSel('','name="category"')}<input name="brand" placeholder="العلامة"><input name="price" type="number" placeholder="السعر ج.س"><input name="stock" type="number" placeholder="المخزون"><input name="cost" type="number" min="0" placeholder="سعر التكلفة ج.س (اختياري)"><input name="sku" placeholder="رمز الصنف SKU (اختياري)"><input name="barcode" placeholder="باركود (اختياري)"><input name="description" placeholder="وصف"><input type="file" id="img" accept="image/*"><button id="add">إضافة</button></div>${bar('بحث في المنتجات').replace(/<\/div>$/,`<select id="cf"><option value="">كل الفئات</option>${CATS.map(c=>`<option ${c===CF?'selected':''}>${c}</option>`).join('')}</select></div>`)}<div class="sc"><table><tr><th>صورة</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>التكلفة</th><th>SKU / باركود</th><th>هامش</th><th>ظاهر</th><th></th></tr>${rows}</table></div><p><small>الأسعار بالجنيه السوداني. المنتج غير الظاهر لا يعرض في المتجر. تغييراتك تحفظ تلقائيا. التكلفة فارغة = غير محددة، ولا تظهر في المتجر.</small></p><p><small>قيمة المخزون بسعر التكلفة (للأصناف ذات التكلفة): ${money(L.filter(p=>p.active&&p.cost>0).reduce((s,p)=>s+p.cost*p.stock,0))} | بسعر البيع: ${money(L.filter(p=>p.active).reduce((s,p)=>s+(p.price||0)*p.stock,0))} | أصناف بلا تكلفة: ${L.filter(p=>p.active&&!(p.cost>0)).length}</small></p>`;hookBar();$('#cf').onchange=()=>{CF=$('#cf').value;render(true)};
$('#add').onclick=async()=>{const b={};document.querySelectorAll('#pf [name]').forEach(i=>b[i.name]=i.value);if(!b.name)return toast('اكتب اسم المنتج');const f=$('#img').files[0];if(f){b.image=await small(f)}await api('admin/products',{method:'POST',body:b});toast('تمت الإضافة');render()};
document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>put('admin/products/'+i.dataset.id,{[i.dataset.f]:i.type==='checkbox'?(i.checked?1:0):i.value}));
document.querySelectorAll('[data-img]').forEach(i=>i.onchange=async()=>{if(i.files[0]){await put('admin/products/'+i.dataset.img,{image:await small(i.files[0])},'تم تحديث الصورة');render(true)}});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف المنتج؟')){await api('admin/products/'+b.dataset.del,{method:'DELETE'});render(true)}});return}
if(tab==='requests'){const L=await api('admin/requests');const bkm=r=>r.type==='حجز كشف نظر'?(r.notes||'').match(/^موعد: (\S+ \d\d:\d\d)/):null;const bkc={};L.forEach(r=>{const m=bkm(r);if(m&&r.status!=='ملغي')bkc[m[1]]=(bkc[m[1]]||0)+1});const rows=L.filter(r=>has(r,Q)&&(!SF||r.status===SF)).map(r=>`<tr><td>${dt(r.created)}</td><td>${esc(r.name)}<br><small>${esc(r.type)}</small></td><td>${esc(r.product)}${(()=>{const m=bkm(r);return m?'<br><b style="color:#0b3d91">موعد '+esc(m[1])+'</b>'+(bkc[m[1]]>1&&r.status!=='ملغي'?'<br><b style="color:#b91c1c">تعارض: '+bkc[m[1]]+' حجوزات في نفس الوقت</b>':''):''})()}${/سطر:|OD:|OS:/.test(r.sizes||'')&&r.status==='جديد'?'<br><b style="color:#b45309">طلب عدسات معلّق</b>':''}</td><td>${esc(r.qty)}</td><td dir="ltr">${esc(r.phone)}</td><td dir="ltr">${esc(r.sizes)}</td><td>${esc(r.notes)}</td><td>${stSel(r.id,r.status)}</td><td><button class="l" data-cust="${r.id}">إلى عميل</button> <button class="d" data-del="${r.id}">حذف</button></td></tr>`).join('');

const BKI={deposit:'إيداع من الصندوق',withdraw:'سحب إلى الصندوق',transfer:'تحويل بين بنوك'},CKI={advance:'صرف عهدة',expense:'مصروف من العهدة',return:'إرجاع للصندوق'};
function movements(Pm,BT,CT,BK){const M=[];const bn=id=>(BK.find(b=>b.id==id)||{name:'؟'}).name;
Pm.forEach(p=>{const inn=p.type==='sale';M.push({date:p.date,acc:p.bank_id||0,in:inn?p.amount:0,out:inn?0:p.amount,desc:AT[p.type]+': '+(p.party||'')+' '+(p.description||'')})});
BT.forEach(t=>{if(t.kind==='deposit'){M.push({date:t.date,acc:t.bank_id,in:t.amount,out:0,desc:'إيداع '+(t.description||'')});M.push({date:t.date,acc:0,in:0,out:t.amount,desc:'إيداع في '+bn(t.bank_id)})}
else if(t.kind==='withdraw'){M.push({date:t.date,acc:t.bank_id,in:0,out:t.amount,desc:'سحب '+(t.description||'')});M.push({date:t.date,acc:0,in:t.amount,out:0,desc:'سحب من '+bn(t.bank_id)})}
else{M.push({date:t.date,acc:t.bank_id,in:0,out:t.amount,desc:'تحويل إلى '+bn(t.to_bank_id)});M.push({date:t.date,acc:t.to_bank_id,in:t.amount,out:0,desc:'تحويل من '+bn(t.bank_id)})}});
CT.forEach(c=>{if(c.kind==='advance')M.push({date:c.date,acc:c.bank_id||0,in:0,out:c.amount,desc:'صرف عهدة: '+(c.description||'')});else if(c.kind==='return')M.push({date:c.date,acc:c.bank_id||0,in:c.amount,out:0,desc:'إرجاع عهدة: '+(c.description||'')})});
return M.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0)}
const balances=(M,BK)=>{const o={0:0};BK.forEach(b=>o[b.id]=Number(b.opening)||0);M.forEach(x=>{o[x.acc]=(o[x.acc]||0)+x.in-x.out});return o};

async function renderLGrid(m){const G=await api('admin/acc/lensgrid');const S=Object.fromEntries((G.set||[]).map(x=>[x.k,x.v]));const step=S.lens_step||'0.25',stepAssumed=false,sg=S.lens_addsign||'+';

const f=v=>v===0?'0':(v>0?'+':'')+v.toFixed(2);
const st=Number(step);const SPH=rng(0,sMin,st);const CYL=[0].concat(rng(-0.25,cMin,st));
const ADDS=sg?(()=>{const o=[];for(let v=0.5;v<=aMax+1e-9;v=Math.round((v+st)*100)/100)o.push(v);return o})():[];
const LU=localStorage.pvLU==='p'?'p':'l',K=LU==='p'?0.5:1;const mp={};(G.rows||[]).forEach(r=>mp[[r.sph,r.cyl,r.add_v].join('|')]=r.qty);const U=q=>q==null||q===''?'':(LU==='p'?q/2:q);

const SG=await api('admin/acc/lensgrid/single');const sm={};(Array.isArray(SG)?SG:[]).forEach(x=>sm[x.kind+'|'+x.val]=x.qty);
const SPH1=SPH.filter(v=>v!==0),CYL1=CYL.filter(v=>v!==0);
const one=(kind,list0)=>{const ex=Object.keys(sm).filter(k=>k.startsWith(kind+'|')).map(k=>Number(k.slice(kind.length+1))).filter(v=>!list0.includes(v));const list=list0.concat(ex).sort((a,b)=>b-a);return `<div class="sc"><table style="width:auto"><tr><th>${kind.toUpperCase()}</th><th>Qty (${LU==='p'?'pairs':'lenses'})</th></tr>${list.map(v=>`<tr><th>${f(v)}</th><td><input type="number" min="0" step="${K}" style="width:70px" data-k1="${kind}" data-v1="${v}" value="${U(sm[kind+'|'+String(v)])||''}"></td></tr>`).join('')}<tr><td><input type="number" step="0.25" style="width:70px" id="nv_${kind}" placeholder="other ${kind.toUpperCase()}"></td><td><input type="number" min="0" style="width:70px" id="nq_${kind}" placeholder="Qty"> <button data-nadd="${kind}">Add</button></td></tr></table></div>`};
