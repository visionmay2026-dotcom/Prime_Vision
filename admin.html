<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="fonts.css"><title>لوحة التحكم - Prime Vision</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;background:#f5f1ea;color:#10294a}header{background:#10294a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e4dccd}nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfc5b2;border-radius:8px;background:#fff}button{cursor:pointer;background:#10294a;color:#fff;border:0}button.l{background:#fff;color:#10294a;border:1px solid #cfc5b2}button.on{background:#c9983a;color:#10294a}button.d{background:#a33}
main{padding:12px;max-width:1000px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{background:#fff;border-radius:12px;padding:14px;text-align:center}.c b{display:block;font-size:26px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:14px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0;background:#fff;padding:10px;border-radius:12px}.sc{overflow:auto}.th{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee}.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar input,.bar select{flex:1;min-width:120px}.low{background:#fff4d6}.tag{font-size:12px;background:#eee;border-radius:6px;padding:2px 6px}.ed{width:100%;min-width:90px}.ok{color:#2a7a3a}#login{max-width:320px;margin:60px auto;background:#fff;padding:20px;border-radius:14px;display:grid;gap:10px}.rl{display:flex;flex-direction:column;font-size:11px;gap:2px}
[hidden]{display:none!important}
</style><style>.noadd,.nc3 th:nth-child(3),.nc3 td:nth-child(3),.nc4 th:nth-child(4),.nc4 td:nth-child(4){display:none}</style></head><body>
<div id="login"><h3>لوحة التحكم</h3><input id="pw" type="password" placeholder="كلمة المرور"><button id="lb">دخول</button><small id="le" style="color:#a33"></small></div>
<div id="app" hidden><header><b>Prime Vision · لوحة التحكم</b><button class="l" id="out">خروج</button></header><nav id="nav"></nav><main id="m"></main></div>
<script>
const T={dash:'الرئيسية',products:'المنتجات والمخزون',requests:'الطلبات الواردة',orders:'الطلبات',customers:'العملاء',a_sale:'المبيعات (محاسبة)',a_purchase:'المشتريات',a_expense:'المصروفات',a_debts:'الذمم',a_ledger:'دفتر النقد',a_report:'التقارير المالية',a_banks:'البنوك',a_custody:'عهدة المصروفات',a_all:'الصندوق والبنوك',a_report2:'التقرير الموحد',a_fs:'القوائم المالية',a_msg:'رسائل العملاء',a_export:'تصدير وتحليل',a_sup:'الموردون',a_coa:'دليل الحسابات',a_docs:'المستندات',a_rx:'الوصفات الطبية',a_lens:'طلبات العدسات',a_lgrid:'نطاق العدسات',a_bulk:'طلبيات الجملة',a_inv:'Stock',a_stmt:'كشف الحساب'};
const ST=['جديد','قيد المعالجة','تم التواصل','مكتمل','ملغي'];const CATS=['الفريمات','العدسات الطبية','العدسات اللاصقة التجميلية','العدسات اللاصقة الطبية','أدوات بصريات','أخرى'];let CF='';const catSel=(v,attrs)=>`<select ${attrs}>${v&&!CATS.includes(v)?`<option value="${esc(v)}" selected>${esc(v)} (قديم)</option>`:''}${v?'':'<option value="">الفئة</option>'}${CATS.map(c=>`<option ${c===v?'selected':''}>${c}</option>`).join('')}</select>`;
let tab='dash',Q='',SF='';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=()=>sessionStorage.pvt||'';
const money=n=>Number(n||0).toLocaleString('en-US')+' ج.س';
const dt=s=>s?String(s).slice(0,16).replace('T',' '):'';
const has=(o,q)=>!q||Object.values(o).some(v=>String(v==null?'':v).toLowerCase().includes(q.toLowerCase()));
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+tok()},body:o.body&&JSON.stringify(o.body)});if(r.status===401&&p!=='login'){sessionStorage.pvt='';location.reload();return[]}return r.json()}
const toast=m=>{let t=$('#ts');if(!t){t=document.createElement('div');t.id='ts';t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#10294a;color:#fff;padding:8px 16px;border-radius:10px;z-index:9';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',1800)};
$('#lb').onclick=async()=>{const r=await api('login',{method:'POST',body:{password:$('#pw').value}});if(r.token){sessionStorage.pvt=r.token;start()}else $('#le').textContent='كلمة المرور غير صحيحة'};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lb').click()};$('#out').onclick=()=>{sessionStorage.pvt='';location.reload()};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function csv(rows){if(!rows.length)return'';const k=Object.keys(rows[0]).filter(x=>x!=='image');return '\ufeff'+[k.join(',')].concat(rows.map(r=>k.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))).join('\n')}
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':'l'}" data-k="${k}">${v}</button>`).join('')+'<button class="l" id="ex">نسخة احتياطية JSON</button><button class="l" id="ec">تصدير CSV</button><button class="l" id="fx">نسخة كاملة (كل الجداول والمستندات)</button>';
document.querySelectorAll('#nav [data-k]').forEach(b=>b.onclick=()=>{tab=b.dataset.k;Q='';SF='';CF='';start()});
$('#ex').onclick=async()=>{dl('pv-backup.json',JSON.stringify(await api('admin/export'),null,1),'application/json')};
$('#ec').onclick=async()=>{const d=await api('admin/export');for(const k of['products','customers','orders','requests'])dl('pv-'+k+'.csv',csv(d[k]),'text/csv')};render()}
const bar=(ph,withSt)=>`<div class="bar"><input id="q" placeholder="${ph}" value="${esc(Q)}">${withSt?`<select id="sf"><option value="">كل الحالات</option>${ST.map(s=>`<option ${s===SF?'selected':''}>${s}</option>`).join('')}</select>`:''}</div>`;
function hookBar(){const q=$('#q');q.oninput=()=>{Q=q.value;clearTimeout(hookBar.h);hookBar.h=setTimeout(()=>render(true),250)};const s=$('#sf');if(s)s.onchange=()=>{SF=s.value;render(true)}}
const stSel=(id,cur)=>`<select data-id="${id}">${ST.map(s=>`<option ${s===cur?'selected':''}>${s}</option>`).join('')}</select>`;
function put(path,body,msg){return api(path,{method:'PUT',body}).then(()=>toast(msg||'تم الحفظ'))}
async function render(keep){const m=$('#m');m.dir='';
if(tab.startsWith('a_'))return renderAcc(m);
if(tab==='dash'){const [s,P,R]=await Promise.all([api('admin/stats'),api('admin/products'),api('admin/requests')]);const low=P.filter(p=>p.active&&p.stock<=3);
m.innerHTML='<div class="cards">'+[['المنتجات',s.products],['مخزون منخفض',s.lowStock],['طلبات واردة جديدة',s.newRequests],['طلبات مفتوحة',s.openOrders],['العملاء',s.customers],['المبيعات المكتملة',money(s.sales)]].map(x=>`<div class="c">${x[0]}<b>${esc(x[1])}</b></div>`).join('')+'</div><h4>مخزون منخفض (3 أو أقل)</h4>'+(low.length?'<table>'+low.map(p=>`<tr class="low"><td>${esc(p.name)}</td><td>${p.stock}</td></tr>`).join('')+'</table>':'<p>لا يوجد.</p>')+'<h4>آخر الطلبات الواردة</h4>'+(R.length?'<table>'+R.slice(0,5).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.product)}</td><td>${esc(r.status)}</td><td>${dt(r.created)}</td></tr>`).join('')+'</table>':'<p>لا يوجد.</p>')+'<h4>إعدادات المتجر</h4><div class="f"><label><input type="checkbox" id="sw"> إظهار طلبية الجملة في المتجر</label><label><input type="checkbox" id="sf2"> إظهار الفريمات في المتجر</label></div><p><small>الافتراضي: ظاهر. الإيقاف يخفي القسم عن الزبائن فقط ولا يحذف أي بيانات. يشمل إخفاء الفريمات: منتجات فئة الفريمات في المتجر وقسمي النظارات الطبية والشمسية في الصفحة الرئيسية.</small></p>';try{const ss=await api('admin/site-settings');$('#sw').checked=ss.wholesale!=='0';$('#sf2').checked=ss.frames!=='0'}catch(e){}
$('#sw').onchange=async e=>{await api('admin/site-settings',{method:'POST',body:{k:'show_wholesale',v:e.target.checked?'1':'0'}});toast('تم الحفظ')};$('#sf2').onchange=async e=>{await api('admin/site-settings',{method:'POST',body:{k:'show_frames',v:e.target.checked?'1':'0'}});toast('تم الحفظ')};return}
if(tab==='products'){const L=await api('admin/products');
const rows=L.filter(p=>has(p,Q)&&(!CF||(CATS.includes(p.category)?p.category:'أخرى')===CF)).map(p=>`<tr class="${p.stock<=3?'low':''}"><td>${p.image?`<img class="th" src="${esc(p.image)}">`:''}<br><label class="tag" style="cursor:pointer">صورة<input type="file" accept="image/*" data-img="${p.id}" hidden></label></td><td><input class="ed" value="${esc(p.name)}" data-id="${p.id}" data-f="name"><input class="ed" value="${esc(p.brand)}" data-id="${p.id}" data-f="brand" placeholder="العلامة"><input class="ed" value="${esc(p.description)}" data-id="${p.id}" data-f="description" placeholder="وصف"></td><td>${catSel(p.category||'',`class="ed" data-id="${p.id}" data-f="category"`)}</td><td><input style="width:80px" type="number" min="0" value="${p.price||0}" data-id="${p.id}" data-f="price"></td><td><input style="width:64px" type="number" min="0" value="${p.stock}" data-id="${p.id}" data-f="stock"></td><td><input type="checkbox" ${p.active?'checked':''} data-id="${p.id}" data-f="active"></td><td><button class="d" data-del="${p.id}">حذف</button></td></tr>`).join('');
m.innerHTML=`<div class="f" id="pf"><input name="name" placeholder="اسم المنتج">${catSel('','name="category"')}<input name="brand" placeholder="العلامة"><input name="price" type="number" placeholder="السعر ج.س"><input name="stock" type="number" placeholder="المخزون"><input name="description" placeholder="وصف"><input type="file" id="img" accept="image/*"><button id="add">إضافة</button></div>${bar('بحث في المنتجات').replace(/<\/div>$/,`<select id="cf"><option value="">كل الفئات</option>${CATS.map(c=>`<option ${c===CF?'selected':''}>${c}</option>`).join('')}</select></div>`)}<div class="sc"><table><tr><th>صورة</th><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>ظاهر</th><th></th></tr>${rows}</table></div><p><small>الأسعار بالجنيه السوداني. المنتج غير الظاهر لا يعرض في المتجر. تغييراتك تحفظ تلقائيا.</small></p>`;hookBar();$('#cf').onchange=()=>{CF=$('#cf').value;render(true)};
$('#add').onclick=async()=>{const b={};document.querySelectorAll('#pf [name]').forEach(i=>b[i.name]=i.value);if(!b.name)return toast('اكتب اسم المنتج');const f=$('#img').files[0];if(f){b.image=await small(f)}await api('admin/products',{method:'POST',body:b});toast('تمت الإضافة');render()};
document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>put('admin/products/'+i.dataset.id,{[i.dataset.f]:i.type==='checkbox'?(i.checked?1:0):i.value}));
document.querySelectorAll('[data-img]').forEach(i=>i.onchange=async()=>{if(i.files[0]){await put('admin/products/'+i.dataset.img,{image:await small(i.files[0])},'تم تحديث الصورة');render(true)}});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف المنتج؟')){await api('admin/products/'+b.dataset.del,{method:'DELETE'});render(true)}});return}
if(tab==='requests'){const L=await api('admin/requests');const rows=L.filter(r=>has(r,Q)&&(!SF||r.status===SF)).map(r=>`<tr><td>${dt(r.created)}</td><td>${esc(r.name)}<br><small>${esc(r.type)}</small></td><td>${esc(r.product)}${/سطر:|OD:|OS:/.test(r.sizes||'')&&r.status==='جديد'?'<br><b style="color:#b45309">طلب عدسات معلّق</b>':''}</td><td>${esc(r.qty)}</td><td dir="ltr">${esc(r.phone)}</td><td dir="ltr">${esc(r.sizes)}</td><td>${esc(r.notes)}</td><td>${stSel(r.id,r.status)}</td><td><button class="l" data-cust="${r.id}">إلى عميل</button> <button class="d" data-del="${r.id}">حذف</button></td></tr>`).join('');
m.innerHTML=bar('بحث في الطلبات الواردة',1)+`<div class="sc"><table><tr><th>التاريخ</th><th>الاسم</th><th>المنتج</th><th>الكمية</th><th>الجوال</th><th>المقاسات</th><th>ملاحظات</th><th>الحالة</th><th></th></tr>${rows}</table></div>`;hookBar();
document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>put('admin/requests/'+s.dataset.id,{status:s.value}));
document.querySelectorAll('[data-cust]').forEach(b=>b.onclick=async()=>{const r=L.find(x=>x.id==b.dataset.cust);await api('admin/customers',{method:'POST',body:{name:r.name,type:r.type,phone:r.phone,notes:'من طلب: '+r.product}});toast('أضيف إلى العملاء')});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف الطلب؟')){await api('admin/requests/'+b.dataset.del,{method:'DELETE'});render(true)}});return}
if(tab==='customers'){const L=await api('admin/customers');const rows=L.filter(c=>has(c,Q)).map(c=>`<tr><td><input class="ed" value="${esc(c.name)}" data-id="${c.id}" data-f="name"></td><td><input class="ed" value="${esc(c.type)}" data-id="${c.id}" data-f="type" list="elist"></td><td><input class="ed" dir="ltr" value="${esc(c.phone)}" data-id="${c.id}" data-f="phone"></td><td><input class="ed" dir="ltr" value="${esc(c.email)}" data-id="${c.id}" data-f="email"></td><td><input class="ed" value="${esc(c.city)}" data-id="${c.id}" data-f="city"></td><td><input class="ed" value="${esc(c.area)}" data-id="${c.id}" data-f="area"></td><td><input class="ed" value="${esc(c.org)}" data-id="${c.id}" data-f="org" list="shoplist"><datalist id="shoplist">${L.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></td><td><input class="ed" value="${esc(c.notes)}" data-id="${c.id}" data-f="notes"></td><td><button class="d" data-del="${c.id}">حذف</button></td></tr>`).join('');
await loadEnt();m.innerHTML=`<datalist id="elist">${ENT.map(e=>`<option value="${esc(e.name)}">`).join('')}</datalist><div class="f" id="cf"><input name="name" placeholder="الاسم"><input name="type" list="elist" placeholder="الجهة / النوع"><input name="phone" placeholder="الموبايل"><input name="email" placeholder="الايميل"><input name="city" placeholder="المدينة"><input name="area" placeholder="الحي / القرية"><input name="org" placeholder="جهة العمل"><input name="notes" placeholder="ملاحظات"><button id="add">إضافة</button></div>${bar('بحث في العملاء')}<div class="sc"><table><tr><th>الاسم</th><th>النوع</th><th>الجوال</th><th>الايميل</th><th>المدينة</th><th>الحي/القرية</th><th>جهة العمل</th><th>ملاحظات</th><th></th></tr>${rows}</table></div>`;hookBar();
$('#add').onclick=async()=>{const b={};document.querySelectorAll('#cf [name]').forEach(i=>b[i.name]=i.value);if(!b.name)return toast('اكتب الاسم');await api('admin/customers',{method:'POST',body:b});toast('تمت الإضافة');render()};
document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>put('admin/customers/'+i.dataset.id,{[i.dataset.f]:i.value}));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف؟')){await api('admin/customers/'+b.dataset.del,{method:'DELETE'});render(true)}});return}
if(tab==='orders'){const [L,C,P]=await Promise.all([api('admin/orders'),api('admin/customers'),api('admin/products')]);const act=P.filter(p=>p.active);
const rows=L.filter(o=>has(o,Q)&&(!SF||o.status===SF)).map(o=>`<tr><td>${o.id}<br><small>${dt(o.created)}</small></td><td>${esc(o.customer_name)}</td><td>${esc(o.items)}</td><td>${money(o.total)}</td><td>${stSel(o.id,o.status)}</td><td><button class="d" data-del="${o.id}">حذف</button></td></tr>`).join('');
m.innerHTML=`<div class="f" id="of"><select id="oc"><option value="">عميل (اختياري)</option>${C.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="on" placeholder="أو اسم العميل"><select id="op"><option value="">اختر منتج</option>${act.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock})</option>`).join('')}</select><input id="oq" type="number" min="1" value="1"><button class="l" id="ol">إضافة للطلب</button><div id="lines" style="grid-column:1/-1"></div><input id="ot" type="number" placeholder="الإجمالي ج.س"><input id="onotes" placeholder="ملاحظات"><button id="add">حفظ الطلب</button></div>${bar('بحث في الطلبات',1)}<div class="sc"><table><tr><th>#</th><th>العميل</th><th>الأصناف</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>${rows}</table></div><p><small>عند حفظ الطلب يخصم المخزون تلقائيا من الأصناف المختارة.</small></p>`;hookBar();
const lines=[];const draw=()=>{$('#lines').innerHTML=lines.map((l,i)=>`<span class="tag">${esc(l.name)} × ${l.qty} <a href="#" data-x="${i}">x</a></span> `).join('');const t=lines.reduce((a,l)=>a+l.qty*l.price,0);if(lines.length)$('#ot').value=t;document.querySelectorAll('[data-x]').forEach(a=>a.onclick=e=>{e.preventDefault();lines.splice(+a.dataset.x,1);draw()})};
$('#ol').onclick=()=>{const p=act.find(x=>x.id==$('#op').value);const q=Math.max(1,parseInt($('#oq').value)||1);if(!p)return;lines.push({id:p.id,name:p.name,price:p.price||0,qty:q,stock:p.stock});draw()};
$('#add').onclick=async()=>{const c=C.find(x=>x.id==$('#oc').value);const name=c?c.name:$('#on').value;if(!name)return toast('اختر أو اكتب العميل');
await api('admin/orders',{method:'POST',body:{customer_id:c?c.id:0,customer_name:name,items:lines.map(l=>l.name+' × '+l.qty).join('، '),total:$('#ot').value||0,notes:$('#onotes').value}});
for(const l of lines){const cur=P.find(p=>p.id==l.id);await api('admin/products/'+l.id,{method:'PUT',body:{stock:Math.max(0,cur.stock-l.qty)}})}toast('تم حفظ الطلب');render()};
document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>put('admin/orders/'+s.dataset.id,{status:s.value}));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف؟')){await api('admin/orders/'+b.dataset.del,{method:'DELETE'});render(true)}})}}

// ===== Accounting (separate section) =====
const AT={sale:'مبيعات',purchase:'مشتريات',expense:'مصروفات'},PL={sale:'العميل',purchase:'المورد',expense:'البند/الجهة'};
let BKG=[];const today=()=>new Date().toISOString().slice(0,10);

function roleAmounts(S,nb){const A=S.assets;return{cash:A[0][1],banks:A.slice(1,1+nb).reduce((s,x)=>s+x[1],0),receivables:A[1+nb][1],custody:A[2+nb][1],inventory:A[3+nb][1],payables:S.liab[0][1],vat:S.liab[1][1],equity:S.equity,sales:S.inc[0][1],purchases:-S.inc[1][1],expenses:-S.inc[2][1],custody_exp:-S.inc[3][1]}}
function coaTotals(acc,map,RA){const own={};map.forEach(x=>{if(x.code)own[x.code]=(own[x.code]||0)+(RA[x.role]||0)});const kids={};acc.forEach(a=>{(kids[a.parent||'']=kids[a.parent||'']||[]).push(a)});const tot={};const f=a=>{let t=own[a.code]||0;(kids[a.code]||[]).forEach(k=>t+=f(k));tot[a.code]=t;return t};(kids['']||[]).forEach(f);return{tot,kids}}
function coaRows(acc,kids,tot,cb){const o=[];const walk=(a,d)=>{o.push(cb(a,d,tot[a.code]));(kids[a.code]||[]).forEach(k=>walk(k,d+1))};(kids['']||[]).forEach(a=>walk(a,0));return o}

function fileToData(f){return new Promise((res,rej)=>{if(f.type==='application/pdf'){if(f.size>DMAX)return rej('PDF أكبر من '+Math.round(DMAX/1000)+' ك.ب');const r=new FileReader();r.onload=()=>res({mime:'application/pdf',data:b64(r.result)});r.readAsDataURL(f);return}
if(!/^image\/(jpeg|png|webp)$/.test(f.type))return rej('النوع غير مدعوم: صورة أو PDF فقط');const i=new Image;i.onload=()=>{let k=Math.min(1,1600/Math.max(i.width,i.height)),q=.75,u;for(let n=0;n<8;n++){const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',q);if(b64(u).length*3/4<=DMAX)return res({mime:'image/jpeg',data:b64(u)});q=Math.max(.4,q-.1);k*=.8}rej('تعذر تصغير الصورة بما يكفي')};i.onerror=()=>rej('تعذر قراءة الصورة');i.src=URL.createObjectURL(f)})}

function small(f){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,500/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)})}
if(tok())start();

let NR=0,NRlast=null;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}
function applyBadge(){const b=document.querySelector('#nav [data-k=requests]');if(b&&!b.dataset.base)b.dataset.base=b.textContent;if(b)b.textContent=b.dataset.base+(NR?' ('+NR+')':'');document.title=(NR?'('+NR+') ':'')+'Prime Vision';const nv=document.querySelector('#nav');if(nv&&!document.querySelector('#nt')&&'Notification' in window&&Notification.permission==='default'){const x=document.createElement('button');x.className='l';x.id='nt';x.textContent='تفعيل تنبيهات المتصفح';x.onclick=()=>Notification.requestPermission().then(()=>x.remove());nv.appendChild(x)}}
async function pollNew(){if(!tok())return;try{const s=await api('admin/stats');if(!s||s.newRequests==null)return;NR=s.newRequests;if(NRlast!==null&&NR>NRlast){beep();toast('طلب جديد وصل');try{if('Notification' in window&&Notification.permission==='granted')new Notification('Prime Vision',{body:'طلب جديد وصل'})}catch(e){}}NRlast=NR;applyBadge()}catch(e){}}
const _start=start;start=function(){_start();applyBadge()};
setInterval(pollNew,60000);if(tok())pollNew();

document.addEventListener('click',async e=>{if(!e.target||e.target.id!=='fx')return;e.target.disabled=true;try{const meta=await api('admin/fullexport');const out={format:'pv-full-1',exported_at:meta.exported_at,schema:meta.tables.map(t=>({name:t.name,sql:t.sql,index:!!t.index})),data:{}};for(const t of meta.tables.filter(t=>!t.index)){out.data[t.name]=[];const step=t.name==='acc_docs'?3:200;for(let o=0;o<t.count;o+=step){const r=await api('admin/fullexport?table='+t.name+'&offset='+o+'&limit='+step);out.data[t.name].push(...r.rows)}}
dl('pv-full-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(out),'application/json');toast('تم تنزيل النسخة الكاملة. احفظها في مكان خاص وليس في GitHub')}catch(x){toast('تعذر التصدير')}e.target.disabled=false});

(function(){const SEL='select[name=type],select[name=method],select[data-k=type],select[data-nt],#bt,#gt';
function fix(){document.querySelectorAll(SEL).forEach(s=>{if(s.dataset.oth)return;s.dataset.oth='1';let o=[...s.options].find(x=>x.textContent.trim()==='أخرى');if(!o){o=document.createElement('option');o.textContent='أخرى';s.appendChild(o)}
const cur=s.value;const i=document.createElement('input');i.placeholder='اكتب الخيار';i.style.display='none';i.maxLength=60;s.after(i);
if(/^أخرى: /.test(cur)){o.value=cur;o.selected=true;i.value=cur.slice(6);i.style.display=''}
const sync=()=>{i.style.display=(s.selectedOptions[0]===o)?'':'none';o.value=i.value.trim()?'أخرى: '+i.value.trim():'أخرى'};
s.addEventListener('change',e=>{if(e.isTrusted===false&&e.detail==='oth')return;sync()});i.addEventListener('input',sync);
i.addEventListener('change',()=>{sync();const ev=new CustomEvent('change',{bubbles:true,detail:'oth'});s.dispatchEvent(ev)})})}
new MutationObserver(()=>{clearTimeout(window.__ot);window.__ot=setTimeout(fix,50)}).observe(document.body,{childList:true,subtree:true});fix()})();
</script></body></html>
