<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="fonts.css"><title>لوحة التحكم - Prime Vision</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,sans-serif;background:#f5f1ea;color:#10294a}header{background:#10294a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;overflow:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #e4dccd}nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfc5b2;border-radius:8px;background:#fff}button{cursor:pointer;background:#10294a;color:#fff;border:0}button.l{background:#fff;color:#10294a;border:1px solid #cfc5b2}button.on{background:#c9983a;color:#10294a}button.d{background:#a33}
main{padding:12px;max-width:1000px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{background:#fff;border-radius:12px;padding:14px;text-align:center}.c b{display:block;font-size:26px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:14px}td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0;background:#fff;padding:10px;border-radius:12px}.sc{overflow:auto}#login{max-width:320px;margin:60px auto;background:#fff;padding:20px;border-radius:14px;display:grid;gap:10px}</style></head><body>
<div id="login"><h3>لوحة التحكم</h3><input id="pw" type="password" placeholder="كلمة المرور"><button id="lb">دخول</button><small id="le" style="color:#a33"></small></div>
<div id="app" hidden><header><b>Prime Vision · لوحة التحكم</b><button class="l" id="out">خروج</button></header><nav id="nav"></nav><main id="m"></main></div>
<script>
const T={dash:'الرئيسية',products:'المنتجات والمخزون',requests:'الطلبات الواردة',orders:'الطلبات',customers:'العملاء'};
const ST=['جديد','قيد المعالجة','تم التواصل','مكتمل','ملغي'];let tab='dash';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tok=()=>sessionStorage.pvt||'';
async function api(p,o={}){const r=await fetch('/api/'+p,{...o,headers:{'content-type':'application/json',authorization:'Bearer '+tok()},body:o.body&&JSON.stringify(o.body)});if(r.status===401&&p!=='login'){sessionStorage.pvt='';location.reload()}return r.json()}
$('#lb').onclick=async()=>{const r=await api('login',{method:'POST',body:{password:$('#pw').value}});if(r.token){sessionStorage.pvt=r.token;start()}else $('#le').textContent='كلمة المرور غير صحيحة'};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#lb').click()};$('#out').onclick=()=>{sessionStorage.pvt='';location.reload()};
function start(){$('#login').hidden=true;$('#app').hidden=false;$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${k===tab?'on':'l'}" data-k="${k}">${v}</button>`).join('')+'<button class="l" id="ex">تصدير نسخة</button>';
document.querySelectorAll('#nav [data-k]').forEach(b=>b.onclick=()=>{tab=b.dataset.k;start()});$('#ex').onclick=async()=>{const d=await api('admin/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)]));a.download='pv-backup.json';a.click()};render()}
async function render(){const m=$('#m');
if(tab==='dash'){const s=await api('admin/stats');m.innerHTML='<div class="cards">'+[['المنتجات',s.products],['مخزون منخفض',s.lowStock],['طلبات واردة جديدة',s.newRequests],['طلبات مفتوحة',s.openOrders],['العملاء',s.customers],['المبيعات المكتملة',s.sales]].map(x=>`<div class="c">${x[0]}<b>${esc(x[1])}</b></div>`).join('')+'</div>';return}
if(tab==='products'){const L=await api('admin/products');m.innerHTML=`<div class="f" id="pf"><input name="name" placeholder="اسم المنتج"><input name="category" placeholder="الفئة"><input name="brand" placeholder="العلامة"><input name="price" type="number" placeholder="السعر"><input name="stock" type="number" placeholder="المخزون"><input name="description" placeholder="وصف"><input type="file" id="img" accept="image/*"><button id="add">إضافة</button></div><div class="sc"><table><tr><th>المنتج</th><th>الفئة</th><th>السعر</th><th>المخزون</th><th>ظاهر</th><th></th></tr>${L.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.brand)}</small></td><td>${esc(p.category)}</td><td><input style="width:80px" type="number" value="${p.price||0}" data-id="${p.id}" data-f="price"></td><td><input style="width:70px" type="number" value="${p.stock}" data-id="${p.id}" data-f="stock"></td><td><input type="checkbox" ${p.active?'checked':''} data-id="${p.id}" data-f="active"></td><td><button class="d" data-del="${p.id}">حذف</button></td></tr>`).join('')}</table></div>`;
$('#add').onclick=async()=>{const b={};document.querySelectorAll('#pf [name]').forEach(i=>b[i.name]=i.value);if(!b.name)return;const f=$('#img').files[0];if(f){b.image=await small(f)}await api('admin/products',{method:'POST',body:b});render()};
document.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>api('admin/products/'+i.dataset.id,{method:'PUT',body:{[i.dataset.f]:i.type==='checkbox'?(i.checked?1:0):i.value}}));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف المنتج؟')){await api('admin/products/'+b.dataset.del,{method:'DELETE'});render()}});return}
if(tab==='requests'){const L=await api('admin/requests');m.innerHTML=`<div class="sc"><table><tr><th>الاسم</th><th>النوع</th><th>المنتج</th><th>الكمية</th><th>الجوال</th><th>ملاحظات</th><th>الحالة</th></tr>${L.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${esc(r.product)}</td><td>${esc(r.qty)}</td><td>${esc(r.phone)}</td><td>${esc(r.notes)}</td><td><select data-id="${r.id}">${ST.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`;
document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>api('admin/requests/'+s.dataset.id,{method:'PUT',body:{status:s.value}}));return}
if(tab==='customers'){const L=await api('admin/customers');m.innerHTML=`<div class="f" id="cf"><input name="name" placeholder="الاسم"><input name="type" placeholder="النوع (فرد/مركز/مستشفى)"><input name="phone" placeholder="الجوال"><input name="city" placeholder="المدينة"><input name="notes" placeholder="ملاحظات"><button id="add">إضافة</button></div><div class="sc"><table><tr><th>الاسم</th><th>النوع</th><th>الجوال</th><th>المدينة</th><th></th></tr>${L.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.type)}</td><td>${esc(c.phone)}</td><td>${esc(c.city)}</td><td><button class="d" data-del="${c.id}">حذف</button></td></tr>`).join('')}</table></div>`;
$('#add').onclick=async()=>{const b={};document.querySelectorAll('#cf [name]').forEach(i=>b[i.name]=i.value);if(!b.name)return;await api('admin/customers',{method:'POST',body:b});render()};
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف؟')){await api('admin/customers/'+b.dataset.del,{method:'DELETE'});render()}});return}
if(tab==='orders'){const L=await api('admin/orders');m.innerHTML=`<div class="f" id="of"><input name="customer_name" placeholder="اسم العميل"><input name="items" placeholder="الأصناف (نص)"><input name="total" type="number" placeholder="الإجمالي"><input name="notes" placeholder="ملاحظات"><button id="add">إضافة طلب</button></div><div class="sc"><table><tr><th>#</th><th>العميل</th><th>الأصناف</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>${L.map(o=>`<tr><td>${o.id}</td><td>${esc(o.customer_name)}</td><td>${esc(o.items)}</td><td>${esc(o.total)}</td><td><select data-id="${o.id}">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="d" data-del="${o.id}">حذف</button></td></tr>`).join('')}</table></div>`;
$('#add').onclick=async()=>{const b={};document.querySelectorAll('#of [name]').forEach(i=>b[i.name]=i.value);if(!b.customer_name)return;await api('admin/orders',{method:'POST',body:b});render()};
document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>api('admin/orders/'+s.dataset.id,{method:'PUT',body:{status:s.value}}));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف؟')){await api('admin/orders/'+b.dataset.del,{method:'DELETE'});render()}})}}
function small(f){return new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,500/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)})}
if(tok())start();
</script></body></html>
